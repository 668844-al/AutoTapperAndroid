name: Build iOS Glass Translator EXE

on:
  push:
    branches:
      - translator-ios-glass
    paths:
      - 'translator-ios-glass/**'
      - '.github/workflows/build-translator.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: translator-ios-glass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: translator-ios-glass/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate icon
        run: python make_icon.py

      - name: Build single-file EXE
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "中英文互译"
          --icon app.ico
          --collect-all deep_translator
          app.py

      - name: Smoke check
        shell: pwsh
        run: |
          if (!(Test-Path "dist/中英文互译.exe")) { throw "EXE not produced" }
          Get-Item "dist/中英文互译.exe" | Format-List Name,Length,FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ios-glass-translator-responsive-v2
          path: translator-ios-glass/dist/中英文互译.exe
          if-no-files-found: error
          compression-level: 0
