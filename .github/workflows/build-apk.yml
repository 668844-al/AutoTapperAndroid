name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore custom app icon
        run: |
          mkdir -p app/src/main/res/drawable
          cat assets/icon_part_*.b64 | base64 -d > app/src/main/res/drawable/app_icon.webp
          cp app/src/main/res/drawable/app_icon.webp app/src/main/res/drawable/launcher_icon_v25.webp
          test -s app/src/main/res/drawable/launcher_icon_v25.webp

      - name: Patch recorder touch and coordinates
        run: python3 scripts/patch_v26.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTapper-v2.6-recorder-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
